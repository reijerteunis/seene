# The services the stack needs beside Supabase, and the only definition of them:
# `pnpm dev:up` on a laptop and the node job in .github/workflows/ci.yml start this
# same file, so a test that passes on one cannot fail on the other for a version.
#
# Supabase's own containers are not here. The Supabase CLI owns them and reads
# supabase/config.toml, which both paths also share.

name: seen

services:
  # BullMQ's queue. Pinned to 8 to match the image CI has been green on since
  # SEEN-006; docs/architecture.md says the same number.
  redis:
    image: redis:8
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Every outbound mail, and a web inbox to read it in. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_HTTP_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces and per-tenant cost lines, printed. Cloud Logging replaces the exporter
  # after the SEEN-007 go decision; the code keeps sending OTLP either way.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '${OTLP_HTTP_PORT:-4318}:4318'
      - '${OTLP_GRPC_PORT:-4317}:4317'
      - '13133:13133'
      - '${OTLP_METRICS_PORT:-8888}:8888'
    healthcheck:
      test: ['CMD', '/otelcol-contrib', 'components']
      interval: 5s
      timeout: 3s
      retries: 10
