# Why: rules/registry.toml, ast-grep/no-credential-literal-in-tests.
id: no-credential-literal-in-tests
language: Tsx
severity: error
message: A JWT is written as a literal here. Read the credential from the environment and skip the test when it is absent.
note: |
  SEEN-097 F2: stack.test.ts carried the local Supabase service-role JWT as a
  literal fallback, and gitleaks did not catch it because the key is the
  Supabase CLI's published demo one. eyJ is a base64 JWT header, which is what
  every one of them begins with.
# Under apps and packages, like every rule in this set, which is also what keeps
# the rule off rules/fixtures: the violation this rule stands on is a test file
# and would otherwise be reported where it lies.
files:
  - "{apps,packages}/**/*.{test,spec}.{ts,tsx,mts,cts}"
rule:
  any:
    - kind: string_fragment
    - kind: template_string
  regex: 'eyJ'
