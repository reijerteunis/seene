# Thresholds and vocabularies the stage gates apply.
#
# A value belongs here only when changing it is a legitimate decision that
# should not require a code change, and should be visible as a diff a human
# reviews. Structure (the stages, the record envelope, what advance means)
# lives in code. Missing or malformed, this file is fatal: a harness running
# on silent defaults is a harness with unknown rules.
#
# Later tickets add their own sections: SEEN-088 [jev], SEEN-089 [coverage],
# SEEN-090 [security].

[tickets]
prefix = "SEEN"

[actors]
tools = ["claude", "codex", "human"]
roles = ["implementer", "reviewer"]
# The two that can review each other's work. A person reviewing alone is not the
# other assistant, which is what a ticket touching billing or an agent action
# needs: SEEN-105's second review, G6.
assistants = ["claude", "codex"]

[stages]
return_targets = ["clarify", "solution", "tdd"]

[checks]
phases = ["red", "green", "regression", "qa"]
default_timeout_seconds = 600
maximum_timeout_seconds = 3600
output_limit_bytes = 65536

[review]
severities = ["low", "medium", "high", "blocking"]
# The review triage, from SEEN-107. Shadow is on until SEEN-109's window says the
# narrowing saves more than it misses: in shadow the reviewer still reads every
# changed file and the triage record stores what would have been excluded, so the
# figure that decides is measured before anything is decided on it. Turning it off
# is one line here, which is a diff a person reviews.
triage_shadow = true
# How sure Jev has to be that a file is worth reading before it enters a spot
# review's focus set. Half, to start: a file the model is undecided about is a
# file the reviewer reads. SEEN-109 calibrates it against what a full review found.
focus_probability = 0.5

[non_code]
change_types = ["documentation", "research", "verification", "policy"]

# The decision layer. The questions themselves live in harness/jev.py, because
# their structure is what the harness is; these are the bars they must clear.
[jev]
endpoint = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"
timeout_seconds = 60

[jev.thresholds]
clarified = 0.8
# Calibrated down from 0.8 on 23 September 2026, on the evidence of five
# measurements across two five-point tickets: clarified reached 0.81 once each
# record was genuinely complete, while solution_complete sat at 0.46, 0.52,
# 0.72, 0.50 and 0.51, and closing four real gaps in one record moved it by
# 0.01. The bar was wrong for this question, not the records. 0.6 still refuses
# a vague record; SEEN-091's reports will show whether it holds.
solution_complete = 0.6
must_fix = 0.7
is_destructive = 0.5
# The four triage questions, from SEEN-107. criterion_evidenced is the only one
# that can send a ticket back, so its bar is the one that matters: below it the
# ticket returns to tdd with the criterion named, before any model reads the diff.
# All four are starting values for SEEN-109 to calibrate on ten tickets, not
# numbers anybody has evidence for yet.
criterion_evidenced = 0.6
diff_matches_solution = 0.6
reviewer_must_read = 0.5
review_depth = 0.5
# The two route questions, from SEEN-108. Neither can refuse anything: a route
# below its bar is recorded with the probability it came with and read by
# SEEN-109, which is what decides whether these numbers were ever right.
implementation_model = 0.5
implementation_effort = 0.5

# The context budget, from SEEN-099. Three MCP servers put three sets of tool
# schemas into every session before a ticket is read; these say what that buys.
# The decision rule is written before the numbers exist, because a rule chosen
# after seeing the figure is not a rule.
[context]
rules = [
  "One tool call per question. A second call answering the same question is a question that was not asked properly.",
  "A codegraph query names a symbol, not a directory. A directory is a repository-wide read wearing a tool's name.",
  "No repository-wide read when a graph can answer. grep over the tree is the last resort, not the first move.",
]
baseline = "docs/harness/reports/context-tools-baseline.json"
# A ticket counts towards the comparison only if it started after both tools
# existed. SEEN-096 installed codegraph during its own work and SEEN-098
# installed repowise during its own, so neither was worked with what it added,
# and a date alone would have counted them both: this is SEEN-098's receipt.
tools_available_from = "2026-09-24T06:15:10.769645+00:00"
minimum_tickets = 5
# When both agents of SEEN-105 existed: the commit that generated their copies,
# cc0449d on 24 September 2026. A ticket that installed a tool was not worked with
# it, which is the rule SEEN-098 wrote for itself; SEEN-105 started at 11:36 that
# morning, so its own figures are not the figures its fifth criterion asks for.
agents_available_from = "2026-09-24T12:18:27+00:00"
decision_rule = "Below the baseline, the tools paid for the context they occupy and stay. Above it, one is removed, graphify first, because codegraph and repowise can partly answer its questions. A rise removes them immediately rather than after five tickets. The call is the founder's."

# The session cap, from SEEN-104. The slice is the unit of context and the
# ticket stays the unit of delivery: one branch, one pull request, one receipt.
# The baseline in docs/harness/reports/context-tools-baseline.json says 40,600
# output tokens per point, so a three-point ticket worked in one session
# compacts its context at least once, and compaction is where evidence quietly
# becomes summary.
[session]
# A slice is what one context can hold start to finish. Two points is about
# four hours with Claude Code, which is the length a session stays sharp.
max_points_per_slice = 2
# A plan that needs more is a ticket that is too big, and it is split the way
# SEEN-089 and SEEN-096 were rather than worked in five sessions.
max_slices_per_ticket = 4
# Two thirds of what a three-point ticket cost in one session at the baseline.
# budget reports against it; nothing refuses on it, because only the person at
# the keyboard can end a session.
output_token_budget = 60000
# The handoff pack is the only thing that crosses a slice boundary, so it is
# small enough to be read in full by the session that receives it.
handoff_token_limit = 2000

# The two agents with a context of their own, from SEEN-105. The roster and the
# cap are here rather than in code because adding an agent or moving the cap is a
# legitimate decision that should be a diff a person reviews; what each agent may
# do is structure and lives in harness/agents.py.
[agents]
# The implementer joins the two readers in SEEN-108. It is the one agent whose
# model and effort are not its own: they are the route's, read from the branch's
# route record's spawn instruction, so its generated copies never vary: a file
# whose content depended on the ticket in hand was wrong four ways and is why
# SEEN-108 could not merge until record 121.
names = ["seen-scout", "seen-reviewer", "seen-implementer"]
# A brief is what crosses back into the session that asked, so it is small enough
# to be read in full. Four hundred words is about two thirds of the handoff pack.
brief_word_limit = 400

# The route, from SEEN-108. Which model and which effort implement each slice is
# decided at the tdd stage with the plan and the risk answers on record, and
# never inside the session that would benefit from a stronger model.
[routing]
# Weakest first. The last one is the strongest, which is what every rule and
# every absence routes to, so adding a model is a line here and not a change in
# code. These are the tier names Claude Code and Codex take in an agent file.
tiers = ["haiku", "sonnet", "opus"]
efforts = ["low", "medium", "high"]
# What a rule gives: the strongest tier at the highest effort.
rule_effort = "high"
# True until SEEN-109's ten-ticket window says the routes save more than they
# cost. In shadow the route is computed and recorded while every slice still
# runs on whatever model the session is, and the tdd gate reports a mismatch
# rather than refusing it. Turning it off is one line here, which is a diff a
# person reviews, exactly as [review] triage_shadow is.
shadow = true

# A tier against the model id a Claude Code session log carries, which is the
# only way a recorded check can be compared with a route. Verified on 25
# September 2026: every entry in this project's logs carries message.model. A
# tier whose id is unknown here is never refused against, because a comparison
# with nothing is not a comparison.
[routing.models]
haiku = "claude-haiku-4-5-20251001"
sonnet = "claude-sonnet-5"
opus = "claude-opus-5"

# What Jev is never asked about. A slice matching any of these patterns goes to
# the strongest tier at high effort, on the same reasoning the review triage
# takes for full depth: nothing a model could answer would change what these
# settle. fnmatch patterns, so * crosses directories. Three more rules are
# ticket-wide and live in code beside the predicate that already reads them:
# an agent action, billing or the policy gate, and a plan carrying a migration.
[routing.rules]
# Money arithmetic: the pure functions the ground rules say reconcile, and the
# euro arithmetic they do. Everything in core is matching, fee expectations and
# detectors, so the package is the pattern.
# The directory forms as well as the files under them: a slice whose files entry
# reads `packages/core` is the same slice as one naming a file in it, and a rule
# about money arithmetic is not one a plan's wording should be able to dodge.
money = ["packages/core", "packages/core/*"]
# A migration or an RLS policy. Both are expensive to get wrong in the same way
# and both are named by their extension here rather than by their directory,
# because a migration lives wherever the tool that runs it puts it.
migration = ["*.sql", "*/migrations", "*/migrations/*", "*/policies", "*/policies/*"]
# Credentials, wherever they are read, written or named.
credentials = ["*credential*", "*secret*", "*/auth", "*/auth/*",
               "packages/connectors/src/oauth*"]

# What a slice cost, in integer cents per million tokens, by tier. Amounts are
# cents as integers with a currency code, as the ground rules require, and
# priced_on is printed beside every figure derived from them: a price per token
# is stale the day it is written, and the answer to that is to say how old it is
# rather than to report no figure at all.
[routing.prices]
currency = "EUR"
priced_on = "2026-09-25"
# input, output
haiku = { input = 80, output = 400 }
sonnet = { input = 300, output = 1500 }
opus = { input = 1500, output = 7500 }
